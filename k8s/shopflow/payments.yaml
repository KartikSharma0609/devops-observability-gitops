apiVersion: apps/v1
kind: Deployment
metadata: { name: payments, labels: { app: payments } }
spec:
  replicas: 2
  selector: { matchLabels: { app: payments } }
  template:
    metadata:
      labels: { app: payments }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "3002" }
    spec:
      containers:
        - name: payments
          image: payments:local
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3002 }]
          env:
            - { name: PORT, value: "3002" }
            - { name: OTEL_SERVICE_NAME, value: "payments" }
            - { name: PAYMENTS_URL, value: "http://payments:3002" }
          readinessProbe: { httpGet: { path: /health, port: 3002 }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: 3002 }, initialDelaySeconds: 10 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 192Mi }
---
apiVersion: v1
kind: Service
metadata: { name: payments }
spec:
  selector: { app: payments }
  ports: [{ port: 3002, targetPort: 3002 }]

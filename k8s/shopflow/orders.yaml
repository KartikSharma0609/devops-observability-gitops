apiVersion: apps/v1
kind: Deployment
metadata: { name: orders, labels: { app: orders } }
spec:
  replicas: 2
  selector: { matchLabels: { app: orders } }
  template:
    metadata:
      labels: { app: orders }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "3001" }
    spec:
      containers:
        - name: orders
          image: orders:local
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3001 }]
          env:
            - { name: PORT, value: "3001" }
            - { name: OTEL_SERVICE_NAME, value: "orders" }
            - { name: PAYMENTS_URL, value: "http://payments:3002" }
          readinessProbe: { httpGet: { path: /health, port: 3001 }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: 3001 }, initialDelaySeconds: 10 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 192Mi }
---
apiVersion: v1
kind: Service
metadata: { name: orders }
spec:
  selector: { app: orders }
  ports: [{ port: 3001, targetPort: 3001 }]
